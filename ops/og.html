<!doctype html>
<!-- Gera og-image.png (1200x630): ver ops/README no README principal, seção Divulgação. -->
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#101418;color:#eef0f2;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  .wrap{display:grid;grid-template-columns:1fr 520px;height:100%}
  .txt{padding:64px 0 56px 72px;display:flex;flex-direction:column}
  .logo{display:flex;align-items:flex-end;gap:7px;height:56px;margin-bottom:34px}
  .logo i{width:16px;border-radius:4px;display:block}
  .live{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase;border:2px solid #2a3139;border-radius:999px;padding:6px 18px;width:max-content}
  .live b{width:14px;height:14px;border-radius:50%;background:#e0263f;box-shadow:0 0 0 6px rgba(224,38,63,.25)}
  h1{font-size:84px;line-height:1;margin:28px 0 18px;letter-spacing:-.03em}
  p{font-size:30px;line-height:1.3;color:#b4bac2;margin:0;max-width:600px}
  .url{margin-top:auto;font-size:24px;color:#8b939c}
  svg{width:520px;height:630px;display:block}
  path{fill:#1d242c;stroke:#3a434d;stroke-width:1.6}
</style></head><body>
<div class="wrap">
  <div class="txt">
    <div class="logo"><i style="height:26px;background:#1f5fc8"></i><i style="height:52px;background:#c8102e"></i><i style="height:38px;background:#eef0f2"></i></div>
    <span class="live"><b></b>Ao vivo</span>
    <h1>Apuração 2026</h1>
    <p>Presidente: mapa do Brasil por estado e município, gráficos e números do TSE a cada minuto.</p>
    <div class="url">Dados públicos do TSE · atualizado a cada minuto</div>
  </div>
  <svg id="m" viewBox="-40 -20 1080 940" preserveAspectRatio="xMidYMid meet"></svg>
</div>
<script type="module">
  import { STATES } from '../geo.js';
  const svg = document.getElementById('m');
  svg.innerHTML = Object.values(STATES).map((s) => `<path d="${s.d}"/>`).join('');
</script>
</body></html>
